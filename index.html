<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JamRelay</title>
  <meta name="description" content="A small submission and review tool for a fictional game jam.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/submit"><span class="brand-mark" aria-hidden="true">◆</span> JamRelay</a>
      <nav aria-label="Main">
        <div class="nav-group nav-group--creator" role="group" aria-labelledby="nav-creator">
          <span class="nav-group-label" id="nav-creator">Creator</span>
          <a data-nav="submit" href="#/submit">Submit</a>
          <a data-nav="mine" href="#/mine">My entries</a>
        </div>
        <div class="nav-group nav-group--organizer" role="group" aria-labelledby="nav-organizer">
          <span class="nav-group-label" id="nav-organizer">Organizer</span>
          <a data-nav="dashboard" href="#/dashboard">Dashboard</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="view" class="wrap" tabindex="-1"></main>

  <footer class="wrap site-footer">
    <p>Demo project · Driftwood Jam and all entries are fictional · Data is saved in a local SQLite database.</p>
    <button type="button" id="reset-demo" class="btn btn--ghost">Reset demo data</button>
  </footer>

  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
